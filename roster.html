<!DOCTYPE html>

  <meta name="description" content="Les membres actifs de la guilde Absolution — WoW et SWTOR. Tanks, Heals, DPS.">
  <meta property="og:type"        content="website">
  <meta property="og:title"       content="Roster — Absolution">
  <meta property="og:description" content="Membres actifs de la guilde Absolution. WoW Mythic · SWTOR progression · Guilde française.">
  <meta property="og:image"       content="https://absolution-guild.pages.dev/og-banner.jpg">
  <meta property="og:url"         content="https://absolution-guild.pages.dev/roster.html">

  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="page-body">
<!-- Ce bloc est identique dans toutes les pages -->
<canvas id="bg-canvas"></canvas>
<div id="nav-root"></div>

<main>


<div class="hero-page">
  <span class="eyebrow" data-eid="roster-eyebrow">La guilde</span>
  <h1 class="hero-h1" data-eid="roster-h1">Roster</h1>
  <p class="hero-sub" data-eid="roster-sub">Les membres actifs d'Absolution.</p>
</div>

<div class="roster-tabs">
  <button class="roster-tab wow active" data-game="wow" onclick="showRoster('wow',this)">⚔️ World of Warcraft</button>
  <button class="roster-tab swtor" data-game="swtor" onclick="showRoster('swtor',this)">🚀 SWTOR</button>
</div>


<div class="roster-panel active" id="rpanel-wow">
  <div class="roster-stats" id="rstats-wow"></div>
  <div class="roster-filters" id="rfilters-wow">
    <span class="rf-label">Rôle</span>
    <div class="rf-group">
      <button class="rf-btn active all" onclick="setFilter('wow','role','all',this)">Tous</button>
      <button class="rf-btn tank"       onclick="setFilter('wow','role','tank',this)">🔷 Tank</button>
      <button class="rf-btn heal"       onclick="setFilter('wow','role','heal',this)">💚 Heal</button>
      <button class="rf-btn dps"        onclick="setFilter('wow','role','dps',this)">⚔️ DPS</button>
    </div>
    <div class="rf-sep"></div>
    <span class="rf-label">Grade</span>
    <div class="rf-group">
      <button class="rf-btn active all"   onclick="setFilter('wow','grade','all',this)">Tous</button>
      <button class="rf-btn active staff" onclick="setFilter('wow','grade','staff',this)" style="">Staff</button>
      <button class="rf-btn"              onclick="setFilter('wow','grade','roster_mm',this)">Roster MM</button>
      <button class="rf-btn"              onclick="setFilter('wow','grade','membre',this)">Membre</button>
      <button class="rf-btn"             onclick="setFilter('wow','grade','recrue',this)">Recrue</button>
    </div>
    <div class="rf-sep"></div>
    <input type="text" id="search-wow" placeholder="🔍 Rechercher..." oninput="filterRoster('wow',this.value)" style="font-size:0.78rem;padding:0.3rem 0.65rem;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text-primary);flex:1;min-width:140px;max-width:220px;">
    <span class="search-count" id="search-count-wow"></span>
  </div>
  <div id="rcontent-wow"><div class="skel-block" style="border:none;padding:2rem;"><div class="skel skel-line w-60" style="margin-bottom:1.5rem;height:1.5rem;"></div><div class="skel skel-line w-100"></div><div class="skel skel-line w-80"></div><div class="skel skel-line w-100"></div></div></div>
</div>

<div class="roster-panel" id="rpanel-swtor">
  <div class="roster-stats" id="rstats-swtor"></div>
  <div class="roster-filters" id="rfilters-swtor">
    <span class="rf-label">Rôle</span>
    <div class="rf-group">
      <button class="rf-btn active all" onclick="setFilter('swtor','role','all',this)">Tous</button>
      <button class="rf-btn tank"       onclick="setFilter('swtor','role','tank',this)">🔷 Tank</button>
      <button class="rf-btn heal"       onclick="setFilter('swtor','role','heal',this)">💚 Heal</button>
      <button class="rf-btn dps"        onclick="setFilter('swtor','role','dps',this)">⚔️ DPS</button>
    </div>
    <div class="rf-sep"></div>
    <span class="rf-label">Grade</span>
    <div class="rf-group">
      <button class="rf-btn active all"   onclick="setFilter('swtor','grade','all',this)">Tous</button>
      <button class="rf-btn active staff" onclick="setFilter('swtor','grade','staff',this)">Staff</button>
      <button class="rf-btn"              onclick="setFilter('swtor','grade','membre',this)">Membre</button>
      <button class="rf-btn"             onclick="setFilter('swtor','grade','recrue',this)">Recrue</button>
    </div>
    <div class="rf-sep"></div>
    <input type="text" id="search-swtor" placeholder="🔍 Rechercher..." oninput="filterRoster('swtor',this.value)" style="font-size:0.78rem;padding:0.3rem 0.65rem;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text-primary);flex:1;min-width:140px;max-width:220px;">
    <span class="search-count" id="search-count-swtor"></span>
  </div>
  <div id="rcontent-swtor"><div class="skel-block" style="border:none;padding:2rem;"><div class="skel skel-line w-60" style="margin-bottom:1.5rem;height:1.5rem;"></div><div class="skel skel-line w-100"></div><div class="skel skel-line w-80"></div><div class="skel skel-line w-100"></div></div></div>
</div>

</main>

<div id="footer-root"></div>
<script src="config.js"></script>
<script src="settings.js"></script>
<script src="shared.js"></script>
<script src="blocks.js"></script>
<script src="auth.js"></script>
<script>
var RS_SB  = window.SB_URL;
var RS_KEY = window.SB_KEY;

var ROSTER_GRADES = { gm:'GM', officier:'Officier', roster_mm:'Roster MM', membre:'Membre', recrue:'Recrue', invite:'Invité', admin:'Admin' };
var ROSTER_ORDER  = { gm:0, admin:0, officier:1, roster_mm:2, membre:3, recrue:4, invite:5 };

// Rôle principal de chaque classe
var CLASS_ROLE = {
  'Death Knight':'tank','Druide':'heal','Guerrier':'tank','Paladin':'tank',
  'Moine':'tank','Démoniste':'dps','Évocateur':'heal','Chasseur':'dps',
  'Mage':'dps','Prêtre':'heal','Voleur':'dps','Chaman':'heal',
  'Guerrier Sith':'tank','Inquisiteur Sith':'dps','Agent Impérial':'dps',
  'Chasseur de Primes':'tank','Chevalier Jedi':'tank','Consulaire Jedi':'heal',
  'Soldat':'tank','Contrebandier':'heal'
};

function showRoster(game, btn) {
  document.querySelectorAll('.roster-tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.roster-panel').forEach(function(p) { p.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('rpanel-' + game).classList.add('active');
}

/* roleCtx = null (section Staff) | 'tank' | 'heal' | 'dps' */
var ROLE_COLORS = { tank:'var(--c-tank)', heal:'var(--c-heal)', dps:'var(--c-dps)' };
var ROLE_LABELS = { tank:'Tank', heal:'Heal', dps:'DPS' };
var ROLE_CSS    = { tank:'mc-role-tank', heal:'mc-role-heal', dps:'mc-role-dps' };

function memberCard(m, grade, roleCtx) {
  var cls      = m.wow_class || m.swtor_class || '';
  var spec     = m.wow_spec  || m.swtor_spec  || '';
  var sub      = spec ? spec + (cls ? ' · ' + cls : '') : cls;
  var initials = (m.username || '?').charAt(0).toUpperCase();
  var avatar   = m.avatar_url
    ? '<div class="mc-avatar"><img src="' + m.avatar_url + '" alt="" loading="lazy"></div>'
    : '<div class="mc-avatar">' + initials + '</div>';

  /* Dans sections rôle → couleur du rôle, pas du grade */
  var cardCls, badgeLbl, badgeCls;
  if (roleCtx) {
    cardCls  = 'mc-by-role ' + ROLE_CSS[roleCtx];
    badgeLbl = ROLE_LABELS[roleCtx];
    badgeCls = 'mc-grade mc-grade-role ' + ROLE_CSS[roleCtx];
  } else {
    cardCls  = grade;
    badgeLbl = ROSTER_GRADES[grade] || grade;
    badgeCls = 'mc-grade';
  }

  return '<div class="mc ' + cardCls + '">' +
    '<div class="mc-avatar-wrap">' + avatar + '</div>' +
    '<div class="mc-info">' +
      '<div class="mc-name">' + (m.username || '—') + '</div>' +
      (sub ? '<div class="mc-sub">' + sub + '</div>' : '') +
    '</div>' +
    '<div class="mc-badge"><span class="' + badgeCls + '">' + badgeLbl + '</span></div>' +
  '</div>';
}

var _sectionFirst = true;
var SECTION_CLS = {
  'role-staff-lbl': 'h-staff',
  'role-tank-lbl':  'h-tank',
  'role-heal-lbl':  'h-heal',
  'role-dps-lbl':   'h-dps'
};
function renderSection(members, label, cssClass, roleCtx) {
  if (!members.length) return '';
  var borderTop = _sectionFirst ? 'border-top:none;' : '';
  _sectionFirst = false;
  var hCls = SECTION_CLS[cssClass] || 'h-other';
  return '<div class="role-section">' +
    '<div class="role-header ' + hCls + '" style="' + borderTop + '">' +
      '<span class="role-header-label">' + label + '</span>' +
      '<span class="role-header-count">' + members.length + '</span>' +
    '</div>' +
    '<div class="member-grid">' +
      members.map(function(m) { return memberCard(m, m._grade, roleCtx || null); }).join('') +
    '</div>' +
  '</div>';
}

function renderRoster(members, game) {
  var stats   = document.getElementById('rstats-' + game);
  var content = document.getElementById('rcontent-' + game);
  var rf = game === 'wow' ? 'role_wow'  : 'role_swtor';
  var cf = game === 'wow' ? 'wow_class' : 'swtor_class';

  var active = members.filter(function(m) { return m[rf] && m[rf] !== 'invite'; });
  if (!active.length) {
    if (stats)   stats.innerHTML   = '';
    if (content) content.innerHTML = '<div style="text-align:center;padding:3rem;color:var(--text-muted);font-family:var(--font);">Aucun membre pour le moment.</div>';
    return;
  }

  // Ajouter grade et rôle — priorité au rôle renseigné, sinon déduction par classe
  var roleField2 = game === 'wow' ? 'wow_role' : 'swtor_role';
  active.forEach(function(m) {
    m._grade = m[rf] || 'membre';
    m._role  = m[roleField2] || CLASS_ROLE[m[cf]] || null;
  });

  // Groupes
  var staff  = active.filter(function(m) { return ['gm','admin','officier'].includes(m._grade); });
  var tanks  = active.filter(function(m) { return m._role === 'tank'; });
  var heals  = active.filter(function(m) { return m._role === 'heal'; });
  var dps    = active.filter(function(m) { return m._role === 'dps'; });
  var noRole = active.filter(function(m) { return !m._role && !CLASS_ROLE[m[cf]] && !['gm','admin','officier'].includes(m._grade); });

  // Trier chaque groupe par grade puis nom
  function sortGroup(arr) {
    return arr.sort(function(a,b) {
      var go = (ROSTER_ORDER[a._grade]||9) - (ROSTER_ORDER[b._grade]||9);
      return go !== 0 ? go : (a.username||'').localeCompare(b.username||'');
    });
  }
  sortGroup(staff); sortGroup(tanks); sortGroup(heals); sortGroup(dps);

  // Stats
  var statsHtml = '';
  if (staff.length) statsHtml += '<div class="rs-stat s-staff"><span class="rs-dot" style="background:#F59E0B;box-shadow:0 0 6px #F59E0B;"></span><strong>' + staff.length + '</strong>Staff</div>';
  if (tanks.length) statsHtml += '<div class="rs-stat s-tank"><span class="rs-dot" style="background:#3B82F6;box-shadow:0 0 6px #3B82F6;"></span><strong>' + tanks.length + '</strong>Tanks</div>';
  if (heals.length) statsHtml += '<div class="rs-stat s-heal"><span class="rs-dot" style="background:#22C55E;box-shadow:0 0 6px #22C55E;"></span><strong>' + heals.length + '</strong>Heals</div>';
  if (dps.length)   statsHtml += '<div class="rs-stat s-dps"><span class="rs-dot" style="background:#EF4444;box-shadow:0 0 6px #EF4444;"></span><strong>' + dps.length + '</strong>DPS</div>';
  statsHtml += '<div class="rs-stat s-total"><strong>' + active.length + '</strong>Total</div>';
  if (stats) stats.innerHTML = statsHtml;

  // Contenu
  _sectionFirst = true;
  var html = '';
  html += renderSection(staff,  '★ Staff',  'role-staff-lbl', null);
  html += renderSection(tanks,  '🔷 Tank',  'role-tank-lbl',  'tank');
  html += renderSection(heals,  '💚 Heal',  'role-heal-lbl',  'heal');
  html += renderSection(dps,    '⚔️ DPS',   'role-dps-lbl',   'dps');
  html += renderSection(noRole, 'Membres',  'role-staff-lbl', null);
  if (content) content.innerHTML = html || '<div style="text-align:center;padding:3rem;color:var(--text-muted);font-family:var(--font);">Aucun membre.</div>';
}

var _rosterCache = {};
var _rosterFilters = { wow: { role:'all', grade:'all' }, swtor: { role:'all', grade:'all' } };

function setFilter(game, type, value, btn) {
  _rosterFilters[game][type] = value;
  // Mettre à jour les boutons du groupe
  var panel = document.getElementById('rfilters-' + game);
  if (panel) {
    var btns = panel.querySelectorAll('.rf-btn.' + (type === 'role'
      ? 'all, .rf-btn.tank, .rf-btn.heal, .rf-btn.dps'
      : 'all, .rf-btn.staff, .rf-btn[onclick*="roster_mm"], .rf-btn[onclick*="membre"], .rf-btn[onclick*="recrue"]'));
    // Simpler: re-check all buttons by their onclick
    panel.querySelectorAll('.rf-btn').forEach(function(b) {
      var oc = b.getAttribute('onclick') || '';
      if (oc.indexOf("'" + game + "','" + type + "'") !== -1) {
        var match = oc.match(/setFilter\('[^']+','[^']+','([^']+)'/);
        if (match) b.classList.toggle('active', match[1] === value);
      }
    });
  }
  applyRosterFilters(game);
}

function applyRosterFilters(game) {
  var members = _rosterCache[game] || [];
  var q    = (document.getElementById('search-' + game) || {}).value || '';
  var rf   = _rosterFilters[game];
  var rf2  = game === 'wow' ? 'role_wow' : 'role_swtor';

  var filtered = members.filter(function(m) {
    // Filtre texte
    if (q) {
      var lq = q.toLowerCase();
      var match = (m.username||'').toLowerCase().includes(lq) ||
                  (m.wow_class||'').toLowerCase().includes(lq) ||
                  (m.swtor_class||'').toLowerCase().includes(lq) ||
                  (m.wow_spec||'').toLowerCase().includes(lq) ||
                  (m.swtor_spec||'').toLowerCase().includes(lq);
      if (!match) return false;
    }
    // Filtre rôle
    if (rf.role !== 'all') {
      var roleField = game === 'wow' ? 'wow_role' : 'swtor_role';
      var clsField  = game === 'wow' ? 'wow_class' : 'swtor_class';
      var mRole = m[roleField] || CLASS_ROLE[m[clsField]] || null;
      if (mRole !== rf.role) return false;
    }
    // Filtre grade — hiérarchique (un grade supérieur inclut les inférieurs)
    if (rf.grade !== 'all') {
      var grade = m[rf2] || 'membre';
      var GRADE_INCLUDES = {
        staff:     ['gm','admin','officier'],
        roster_mm: ['gm','admin','officier','roster_mm'],
        membre:    ['gm','admin','officier','roster_mm','membre'],
        recrue:    ['recrue']
      };
      var allowed = GRADE_INCLUDES[rf.grade] || [rf.grade];
      if (!allowed.includes(grade)) return false;
    }
    return true;
  });

  var isFiltered = q || rf.role !== 'all' || rf.grade !== 'all';
  var count = document.getElementById('search-count-' + game);
  if (count) count.textContent = isFiltered ? filtered.length + ' membre' + (filtered.length > 1 ? 's' : '') : '';
  renderRoster(filtered, game);
}

function filterRoster(game, query) {
  applyRosterFilters(game);
}

function loadRoster() {
  fetch(RS_SB + '/rest/v1/profiles?select=username,role_wow,role_swtor,wow_class,swtor_class,wow_role,swtor_role,wow_spec,swtor_spec,avatar_url&order=username.asc', {
    headers: { 'apikey': RS_KEY, 'Authorization': 'Bearer ' + RS_KEY }
  }).then(function(r) { return r.json(); }).then(function(data) {
    var m = Array.isArray(data) ? data : [];
    _rosterCache['wow']   = m;
    _rosterCache['swtor'] = m;
    renderRoster(m, 'wow');
    renderRoster(m, 'swtor');
  }).catch(function() {
    ['wow','swtor'].forEach(function(g) {
      var el = document.getElementById('rcontent-' + g);
      if (el) el.innerHTML = '<div class="load-error"><strong>Erreur de chargement</strong>Impossible de récupérer les membres.<button class="btn btn-ghost" onclick="loadRoster()">Réessayer</button></div>';
    });
  });
}
loadRoster();
</script>

<script>
// Basculer sur l'onglet visible dès que SETTINGS_P résout (pas de setTimeout fragile)
window.SETTINGS_P.then(function() {
  var tabs = document.querySelectorAll('.roster-tab');
  var activeTab = null;
  tabs.forEach(function(t) { if (t.classList.contains('active')) activeTab = t; });
  if (activeTab && activeTab.style.display === 'none') {
    tabs.forEach(function(t) {
      if (t.style.display !== 'none') {
        var game = t.getAttribute('data-game');
        if (game) showRoster(game, t);
      }
    });
  }
});
</script>
</body></html>
