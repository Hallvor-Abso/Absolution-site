<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0D1A3A"/>
      <stop offset="100%" stop-color="#040A18"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#48B8F0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#48B8F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A6FBF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0A3060" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="letterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#9ADCF8"/>
      <stop offset="100%" stop-color="#2899D8"/>
    </linearGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="sharpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="hexClip">
      <polygon points="100,8 178,50 178,150 100,192 22,150 22,50"/>
    </clipPath>
  </defs>

  <!-- Fond hexagonal -->
  <polygon points="100,8 178,50 178,150 100,192 22,150 22,50" fill="url(#bgGrad)"/>

  <!-- Glows -->
  <ellipse cx="100" cy="100" rx="85" ry="85" fill="url(#outerGlow)" filter="url(#blur2)"/>
  <ellipse cx="100" cy="100" rx="55" ry="55" fill="url(#coreGlow)" filter="url(#blur1)"/>

  <!-- Bords hex -->
  <polygon points="100,8 178,50 178,150 100,192 22,150 22,50" fill="none" stroke="#48B8F0" stroke-width="1.5" stroke-opacity="0.6"/>
  <polygon points="100,14 173,53 173,147 100,186 27,147 27,53" fill="none" stroke="#48B8F0" stroke-width="0.5" stroke-opacity="0.25"/>

  <!-- Lignes internes -->
  <line x1="100" y1="8" x2="100" y2="192" stroke="#48B8F0" stroke-width="0.4" stroke-opacity="0.12"/>
  <line x1="22" y1="50" x2="178" y2="150" stroke="#48B8F0" stroke-width="0.4" stroke-opacity="0.12"/>
  <line x1="178" y1="50" x2="22" y2="150" stroke="#48B8F0" stroke-width="0.4" stroke-opacity="0.12"/>

  <!-- A glow large -->
  <text x="100" y="138" font-family="Arial Black, sans-serif" font-size="120" font-weight="900" text-anchor="middle" fill="#48B8F0" opacity="0.15" filter="url(#blur2)">A</text>
  <!-- A glow moyen -->
  <text x="100" y="138" font-family="Arial Black, sans-serif" font-size="120" font-weight="900" text-anchor="middle" fill="#7ED4F8" opacity="0.3" filter="url(#blur1)">A</text>
  <!-- A principal -->
  <text x="100" y="138" font-family="Arial Black, sans-serif" font-size="120" font-weight="900" text-anchor="middle" fill="url(#letterGrad)" filter="url(#sharpGlow)" clip-path="url(#hexClip)">A</text>

  <!-- Reflet bas -->
  <ellipse cx="100" cy="175" rx="35" ry="6" fill="#48B8F0" opacity="0.18" filter="url(#blur1)"/>

  <!-- Points aux coins -->
  <circle cx="100" cy="9" r="2.5" fill="#48B8F0" opacity="0.9"/>
  <circle cx="178" cy="50" r="2" fill="#48B8F0" opacity="0.7"/>
  <circle cx="178" cy="150" r="2" fill="#48B8F0" opacity="0.7"/>
  <circle cx="100" cy="191" r="2.5" fill="#48B8F0" opacity="0.9"/>
  <circle cx="22" cy="150" r="2" fill="#48B8F0" opacity="0.7"/>
  <circle cx="22" cy="50" r="2" fill="#48B8F0" opacity="0.7"/>
</svg>
