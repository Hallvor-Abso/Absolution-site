<!DOCTYPE html>
<html lang="fr" data-theme="cosmic">
<head>
  <meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualités — Absolution</title>
  <meta name="description" content="Toutes les actualités de la guilde Absolution — WoW, SWTOR et nouvelles de la guilde.">
  <meta property="og:type"        content="website">
  <meta property="og:title"       content="Actualités — Absolution">
  <meta property="og:description" content="News WoW Mythic · SWTOR · Vie de guilde — Absolution, guilde française semi-hardcore.">
  <meta property="og:image"       content="https://absolution-guild.pages.dev/og-banner.jpg">
  <meta property="og:url"         content="https://absolution-guild.pages.dev/news.html">
  <meta name="twitter:card"       content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme-v3.css">
  <link rel="stylesheet" href="nav-v3.css">
  <link rel="stylesheet" href="site-v3.css">
</head>
<body class="page-body">
<!-- Ce bloc est identique dans toutes les pages -->
<canvas id="bg-canvas"></canvas>
<div id="nav-root"></div>
<div id="mobile-overlay-root"></div>
<div id="auth-modal-root"></div>

<main>


<div class="hero-page">
  <span class="eyebrow" data-eid="news-eyebrow">Chroniques de la guilde</span>
  <h1 class="hero-h1" data-eid="news-h1">Actualités</h1>
</div>

<div class="filter-bar">
  <button class="filter-btn f-all active" data-cat="all">Toutes</button>
  <button class="filter-btn f-wow" data-cat="wow" data-game="wow">⚔️ World of Warcraft</button>
  <button class="filter-btn f-swtor" data-cat="swtor" data-game="swtor">🚀 SWTOR</button>
  <button class="filter-btn f-guild" data-cat="guild">🏰 Guilde</button>
</div>

<div class="wrap">
  <div id="news-featured"></div>
  <div id="news-grid" class="news-grid">
    <div class="skel-block"><div class="skel skel-line w-40" style="margin-bottom:0.75rem;"></div><div class="skel skel-line w-100" style="height:1.4rem;margin-bottom:0.5rem;"></div><div class="skel skel-line w-80"></div></div>
    <div class="skel-block"><div class="skel skel-line w-40" style="margin-bottom:0.75rem;"></div><div class="skel skel-line w-100" style="height:1.4rem;margin-bottom:0.5rem;"></div><div class="skel skel-line w-80"></div></div>
    <div class="skel-block"><div class="skel skel-line w-40" style="margin-bottom:0.75rem;"></div><div class="skel skel-line w-100" style="height:1.4rem;margin-bottom:0.5rem;"></div><div class="skel skel-line w-80"></div></div>
  </div>
  <div class="pagination" id="news-pag" style="display:none;"></div>
</div>

</main>

<div id="footer-root"></div>
<script src="config.js"></script>
<script src="settings.js"></script>
<script src="shared.js"></script>
<script src="blocks.js"></script>
<script src="auth.js"></script>
<script src="news-cards.js"></script>
<script>
var PER = 6, allNews = [], curCat = 'all', curPage = 1;
var _activeGames = { wow: true, swtor: true }; // mis à jour par settings après chargement

function render() {
  // Filtrer les articles des jeux désactivés
  var filtered = allNews.filter(function(a) {
    if (a.game === 'wow'   && !_activeGames.wow)   return false;
    if (a.game === 'swtor' && !_activeGames.swtor) return false;
    return true;
  });
  var data = curCat === 'all' ? filtered : filtered.filter(function(a) { return a.game === curCat; });
  var feat = document.getElementById('news-featured');
  var grid = document.getElementById('news-grid');
  var pag  = document.getElementById('news-pag');

  if (!data.length) {
    if (feat) feat.innerHTML = '';
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--text-muted);font-family:var(--font);">Aucune actualité pour le moment.</div>';
    if (pag) pag.style.display = 'none';
    return;
  }

  var featured = null, rest = data;
  if (curPage === 1) {
    // Chercher l'article marqué à la une, sinon prendre le premier
    var featIdx = data.findIndex(function(a) { return a.featured; });
    if (featIdx >= 0) {
      featured = data[featIdx];
      rest = data.filter(function(a) { return a.id !== featured.id; });
    } else {
      featured = data[0];
      rest = data.slice(1);
    }
  }
  var total = rest.length;
  var pages = Math.max(1, Math.ceil(total / PER));
  var chunk = rest.slice((curPage - 1) * PER, curPage * PER);

  if (feat) feat.innerHTML = featured ? NC.card(featured, true) : '';
  grid.innerHTML = chunk.map(function(a) { return NC.card(a, false); }).join('');

  if (pag) {
    if (pages > 1) {
      pag.style.display = 'flex';
      pag.innerHTML =
        '<button onclick="go(' + (curPage-1) + ')" ' + (curPage <= 1 ? 'disabled' : '') + '>← Précédent</button>' +
        '<span>Page ' + curPage + ' / ' + pages + '</span>' +
        '<button onclick="go(' + (curPage+1) + ')" ' + (curPage >= pages ? 'disabled' : '') + '>Suivant →</button>';
    } else {
      pag.style.display = 'none';
    }
  }
}

function go(p) { curPage = p; render(); window.scrollTo(0, 0); }

document.querySelectorAll('.filter-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    curCat = btn.dataset.cat;
    curPage = 1;
    render();
  });
});

// Réutiliser les settings déjà chargés par settings.js
window.SETTINGS_P.then(function(cfg) {
  _activeGames.wow   = cfg['wow_enabled']   !== 'false';
  _activeGames.swtor = cfg['swtor_enabled'] === 'true';
  var nowIso = new Date().toISOString();
  NC.get('/rest/v1/news?select=*&order=published_at.desc&limit=100&published=eq.true&or=(publish_at.is.null,publish_at.lte.' + nowIso + ')').then(function(data) {
    allNews = Array.isArray(data) ? data : [];
    if (!allNews.length) {
      document.getElementById('news-grid').innerHTML = '<div class="load-error" style="grid-column:1/-1;"><strong>Aucune actualité</strong>Aucun article disponible pour le moment.</div>';
    }
    render();
  }).catch(function() {
    document.getElementById('news-grid').innerHTML = '<div class="load-error" style="grid-column:1/-1;"><strong>Erreur de chargement</strong>Impossible de récupérer les actualités.<button class="btn btn-ghost" onclick="location.reload()">Réessayer</button></div>';
  });
});
</script>
</body></html>
