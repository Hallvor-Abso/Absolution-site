<!DOCTYPE html>
<html lang="fr" data-theme="cosmic">
<head>
  <meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Profil — Absolution</title>
  <meta name="description" content="Gère ton profil de membre Absolution — infos personnages, WoW, SWTOR et candidatures.">
  <meta property="og:title"       content="Mon Profil — Absolution">
  <meta property="og:description" content="Espace membre Absolution — profil, personnages, statut de candidature.">
  <meta property="og:image"       content="https://absolution-guild.pages.dev/og-banner.jpg">
  <meta name="twitter:card"       content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme-v3.css">
  <link rel="stylesheet" href="nav-v3.css">
  <link rel="stylesheet" href="site-v3.css">
  <style>
    .profil-wrap {
      max-width:980px; margin:0 auto;
      padding:calc(var(--nav-h) + 2.5rem) 2rem 4rem;
    }

    /* Header compact */
    .profil-header {
      display:grid; grid-template-columns:auto 1fr auto;
      align-items:center; gap:2rem;
      padding:1.75rem 2rem;
      background:var(--bg-surface); border:1px solid var(--border);
      margin-bottom:2rem; position:relative; overflow:hidden;
    }
    .profil-header::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--color-primary),var(--color-secondary)); }

    /* Avatar */
    .profil-avatar {
      width:72px; height:72px;
      background:linear-gradient(135deg,rgba(59,130,246,0.2),rgba(255,58,58,0.1));
      border:2px solid var(--border-strong);
      display:flex; align-items:center; justify-content:center;
      font-family:var(--font); font-size:1.6rem; font-weight:900; color:var(--color-primary);
      position:relative; overflow:hidden; cursor:pointer; transition:border-color 0.2s; flex-shrink:0;
    }
    .profil-avatar:hover { border-color:var(--color-primary); }
    .profil-avatar img { position:absolute;inset:0;width:100%;height:100%;object-fit:cover; }
    .av-overlay { position:absolute;inset:0;background:rgba(0,0,0,0.65);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s;font-size:0.55rem;font-family:var(--font);letter-spacing:0.15em;text-transform:uppercase;color:#fff; }
    .profil-avatar:hover .av-overlay { opacity:1; }
    .av-progress { position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--color-primary);width:0%;transition:width 0.3s; }
    #avatar-input { display:none; }

    /* Nom + grades */
    .profil-name  { font-family:var(--font);font-size:1.3rem;font-weight:900;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-primary);margin-bottom:0.35rem; }
    .profil-chips { display:flex;gap:0.4rem;flex-wrap:wrap; }
    .chip { font-family:var(--font);font-size:0.58rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;padding:0.15rem 0.55rem;border:1px solid; }

    /* Layout 2 colonnes */
    .profil-grid { display:grid;grid-template-columns:1fr 1fr;gap:1.75rem;align-items:start; }

    /* Sections */
    .pf-section { background:var(--bg-surface);border:1px solid var(--border);overflow:hidden; }
    .pf-section-head { padding:0.75rem 1.25rem;border-bottom:1px solid var(--border);background:rgba(255,255,255,0.02); }
    .pf-section-title { font-family:var(--font);font-size:0.55rem;font-weight:700;letter-spacing:0.35em;text-transform:uppercase;color:var(--color-primary); }
    .pf-section-body { padding:1.75rem; }

    /* Onglets jeux */
    .game-tabs { display:flex;border-bottom:1px solid var(--border); }
    .game-tab {
      font-family:var(--font);font-size:0.65rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;
      padding:0.65rem 1.25rem;border:none;background:none;cursor:pointer;
      color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.15s;
    }
    .game-tab.wow.active   { color:#3B82F6;border-bottom-color:#3B82F6; }
    .game-tab.swtor.active { color:#FF3A3A;border-bottom-color:#FF3A3A; }
    .game-tab:hover { color:var(--text-primary); }
    .game-panel { display:none;padding:1.25rem; }
    .game-panel.active { display:block; }

    /* Champs */
    .pf-field { margin-bottom:1.1rem; }
    .pf-field:last-child { margin-bottom:0; }
    .pf-field label { font-family:var(--font);font-size:0.6rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-muted);display:block;margin-bottom:0.45rem; }
    .pf-row { display:grid;grid-template-columns:1fr 1fr;gap:1rem; }
    .pf-readonly { font-family:var(--font);font-size:0.82rem;color:var(--text-muted);padding:0.6rem 1rem;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05); }

    /* Boutons save */
    .pf-footer { padding:0.85rem 1.25rem;border-top:1px solid var(--border);background:rgba(0,0,0,0.15);display:flex;align-items:center;gap:1rem; }
    .save-msg { font-family:var(--font);font-size:0.72rem;color:var(--color-success);opacity:0;transition:opacity 0.3s; }
    .save-msg.show { opacity:1; }

    #profil-loading { text-align:center;padding:4rem;color:var(--text-muted);font-family:var(--font); }

    /* Panneau verrouillé pour les invités */
    .game-panel-locked {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:2.5rem 1.5rem; text-align:center; gap:0.75rem;
    }
    .lock-icon { font-size:2rem; opacity:0.4; }
    .lock-title { font-family:var(--font);font-size:0.75rem;font-weight:900;text-transform:uppercase;letter-spacing:0.15em;color:var(--text-muted); }
    .lock-sub   { font-family:var(--font);font-size:0.72rem;color:var(--text-dim);line-height:1.6; }
    #profil-nologin { text-align:center;padding:4rem; }
    #profil-nologin h2 { font-family:var(--font);font-size:1.1rem;font-weight:900;text-transform:uppercase;color:var(--text-primary);margin-bottom:0.75rem; }
    #profil-nologin p { font-size:0.88rem;color:var(--text-muted);margin-bottom:1.5rem; }

    @media(max-width:700px) { .profil-grid{grid-template-columns:1fr;} .pf-row{grid-template-columns:1fr;} .profil-header{grid-template-columns:auto 1fr;} }

    /* Candidatures */
    .cand-item { display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:1rem;padding:0.9rem 1.25rem;border-bottom:1px solid var(--border); }
    .cand-item:last-child { border-bottom:none; }
    .cand-game-dot { width:8px;height:8px;border-radius:50%;flex-shrink:0; }
    .cand-info { min-width:0; }
    .cand-name { font-family:var(--font);font-size:0.82rem;font-weight:700;color:var(--text-primary);margin-bottom:0.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .cand-date { font-family:var(--font);font-size:0.65rem;color:var(--text-muted); }
    .cand-game-lbl { font-family:var(--font);font-size:0.6rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-muted); }
    .cand-status { font-family:var(--font);font-size:0.58rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;padding:0.15rem 0.55rem;border:1px solid;white-space:nowrap; }
    .cand-status.pending  { color:#F0C040;border-color:rgba(240,192,64,0.4); }
    .cand-status.accepted { color:#4AE08A;border-color:rgba(74,224,138,0.4); }
    .cand-status.refused  { color:#FF3A3A;border-color:rgba(255,58,58,0.4); }
    .cand-empty { padding:2rem;text-align:center;font-family:var(--font);font-size:0.8rem;color:var(--text-muted); }
  </style>
  <script src="transitions.js"></script>
</head>
<body class="page-body">
<!-- Ce bloc est identique dans toutes les pages -->
<canvas id="bg-canvas"></canvas>
<div id="nav-root"></div>
<div id="mobile-overlay-root"></div>
<div id="auth-modal-root"></div>


<div class="profil-wrap">
  <div id="profil-loading">Chargement...</div>

  <div id="profil-nologin" style="display:none;">
    <h2>Accès réservé</h2>
    <p>Tu dois être connecté pour accéder à ton profil.</p>
    <button class="btn btn-primary" onclick="openAuth('login')">Se connecter</button>
  </div>

  <div id="profil-content" style="display:none;">

    <!-- Header -->
    <div class="profil-header">
      <div class="profil-avatar" id="pf-avatar" onclick="document.getElementById('avatar-input').click()" title="Changer la photo">
        <span id="pf-avatar-letter">?</span>
        <div class="av-overlay">📷</div>
        <div class="av-progress" id="avatar-progress"></div>
      </div>
      <input type="file" id="avatar-input" accept="image/jpeg,image/png,image/webp" onchange="uploadAvatar(this)">
      <div>
        <div class="profil-name" id="pf-name">—</div>
        <div class="profil-chips">
          <span class="chip" id="pf-chip-global" style="color:var(--color-accent);border-color:rgba(240,192,64,0.4);"></span>
          <span class="chip" id="pf-chip-wow"    style="color:var(--color-primary);border-color:rgba(59,130,246,0.3);"></span>
          <span class="chip" id="pf-chip-swtor"  style="color:var(--color-secondary);border-color:rgba(255,58,58,0.3);"></span>
        </div>
      </div>
      <div style="text-align:right;">
        <div style="font-family:var(--font);font-size:0.58rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-muted);margin-bottom:0.25rem;">Email</div>
        <div style="font-size:0.8rem;color:var(--text-secondary);" id="pf-email">—</div>
      </div>
    </div>

    <!-- Grid 2 colonnes -->
    <div class="profil-grid">

      <!-- Colonne gauche : infos perso -->
      <div class="pf-section">
        <div class="pf-section-head"><span class="pf-section-title">Informations</span></div>
        <div class="pf-section-body">
          <div class="pf-field"><label>Pseudo in-game</label><input type="text" id="pf-username" placeholder="Ton pseudo principal"></div>
          <div class="pf-field"><label>Pseudo Discord</label><input type="text" id="pf-discord" placeholder="pseudo ou pseudo#0000"></div>
        </div>
        <div class="pf-footer">
          <button class="btn btn-primary" onclick="saveProfile()" style="font-size:0.65rem;padding:0.5rem 1.25rem;">Sauvegarder</button>
          <span class="save-msg" id="save-msg">✓ Sauvegardé</span>
        </div>
      </div>

      <!-- Colonne droite : WoW + SWTOR en onglets -->
      <div class="pf-section">
        <div class="game-tabs">
          <button class="game-tab wow active" onclick="showGame('wow',this)">⚔️ WoW</button>
          <button class="game-tab swtor"      onclick="showGame('swtor',this)">🚀 SWTOR</button>
        </div>

        <div class="game-panel active" id="gpanel-wow">
          <div class="pf-row">
            <div class="pf-field"><label>Pseudo WoW</label><input type="text" id="pf-wow-pseudo" placeholder="Nom-Serveur"></div>
            <div class="pf-field"><label>Faction</label>
              <select id="pf-wow-faction"><option value="">— Faction —</option><option>Alliance</option><option>Horde</option></select>
            </div>
          </div>
          <div class="pf-row">
            <div class="pf-field"><label>Rôle principal</label>
              <select id="pf-wow-role">
                <option value="">— Rôle —</option>
                <option value="tank">🔷 Tank</option>
                <option value="heal">💚 Heal</option>
                <option value="dps">⚔️ DPS</option>
              </select>
            </div>
            <div class="pf-field"><label>Spécialisation</label><input type="text" id="pf-wow-spec" placeholder="Ex: Givre, Protection..."></div>
          </div>
          <div class="pf-row">
            <div class="pf-field"><label>Classe</label>
              <select id="pf-wow-class"><option value="">— Classe —</option>
                <option>Death Knight</option><option>Démoniste</option><option>Druide</option>
                <option>Évocateur</option><option>Guerrier</option><option>Chasseur</option>
                <option>Mage</option><option>Moine</option><option>Paladin</option>
                <option>Prêtre</option><option>Voleur</option><option>Chaman</option>
              </select>
            </div>
            <div class="pf-field"><label>Raider.io</label><input type="text" id="pf-raiderio" placeholder="https://raider.io/..."></div>
          </div>
          <div style="display:flex;align-items:center;gap:1rem;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border);">
            <button class="btn btn-primary" onclick="saveWow()" style="font-size:0.65rem;padding:0.5rem 1.25rem;">Sauvegarder</button>
            <span class="save-msg" id="save-wow-msg">✓ Sauvegardé</span>
          </div>
        </div>

        <div class="game-panel" id="gpanel-swtor">
          <div class="pf-row">
            <div class="pf-field"><label>Pseudo SWTOR</label><input type="text" id="pf-swtor-pseudo" placeholder="Nom@Serveur"></div>
            <div class="pf-field"><label>Faction</label>
              <select id="pf-swtor-faction"><option value="">— Faction —</option><option value="republique">République</option><option value="empire">Empire Sith</option></select>
            </div>
          </div>
          <div class="pf-row">
            <div class="pf-field"><label>Rôle principal</label>
              <select id="pf-swtor-role">
                <option value="">— Rôle —</option>
                <option value="tank">🔷 Tank</option>
                <option value="heal">💚 Heal</option>
                <option value="dps">⚔️ DPS</option>
              </select>
            </div>
            <div class="pf-field"><label>Spécialisation</label><input type="text" id="pf-swtor-spec" placeholder="Ex: Ombre, Gardien..."></div>
          </div>
          <div class="pf-field"><label>Classe</label>
            <select id="pf-swtor-class"><option value="">— Classe —</option>
              <option>Guerrier Sith</option><option>Inquisiteur Sith</option>
              <option>Agent Impérial</option><option>Chasseur de Primes</option>
              <option>Chevalier Jedi</option><option>Consulaire Jedi</option>
              <option>Soldat</option><option>Contrebandier</option>
            </select>
          </div>
          <div style="display:flex;align-items:center;gap:1rem;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border);">
            <button class="btn btn-secondary" onclick="saveSwtor()" style="font-size:0.65rem;padding:0.5rem 1.25rem;">Sauvegarder</button>
            <span class="save-msg" id="save-swtor-msg">✓ Sauvegardé</span>
          </div>
        </div>
      </div>

    </div>

    <!-- Candidatures -->
    <div id="pf-candidatures" style="margin-top:1.75rem;display:none;">
      <div class="pf-section">
        <div class="pf-section-head" style="display:flex;align-items:center;justify-content:space-between;">
          <span class="pf-section-title">Mes candidatures</span>
          <span style="font-family:var(--font);font-size:0.6rem;color:var(--text-dim);">Statut mis à jour par les officiers</span>
        </div>
        <div id="pf-cand-list"></div>
      </div>
    </div>

  </div>
</div>

<div id="footer-root"></div>
<script src="config.js"></script>
<script src="settings.js"></script>
<script src="shared.js"></script>
<script src="auth.js"></script>
<script>
var PROF_SB  = window.SB_URL;
var PROF_KEY = window.SB_KEY;
var PROF_GRADES = { gm:'GM', officier:'Officier', roster_mm:'Roster MM', membre:'Membre', recrue:'Recrue', invite:'Invité', admin:'Admin' };
var _uid = null;

function v(id)   { return (document.getElementById(id) ? document.getElementById(id).value : '').trim(); }
function g(id)   { return document.getElementById(id); }
function tok()   { try { var s=JSON.parse(localStorage.getItem('abs_sess')); return (s && s.access_token) ? s.access_token : PROF_KEY; } catch(e) { return PROF_KEY; } }

function showMsg(id) {
  var el = g(id); if (!el) return;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 2500);
}

function showGame(game, btn) {
  document.querySelectorAll('.game-tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.game-panel').forEach(function(p) { p.classList.remove('active'); });
  btn.classList.add('active');
  g('gpanel-' + game).classList.add('active');
}

async function sbPatch(path, body) {
  try {
    var r = await fetch(PROF_SB + path, {
      method:'PATCH',
      headers:{'apikey':PROF_KEY,'Authorization':'Bearer '+tok(),'Content-Type':'application/json','Prefer':'return=minimal'},
      body: JSON.stringify(body)
    });
    return r.ok || r.status === 204;
  } catch { return false; }
}



function fillProfile(p, email) {
  if (!p) return;
  var letter = g('pf-avatar-letter');
  if (letter) letter.textContent = (p.username || '?')[0].toUpperCase();
  var av = g('pf-avatar');
  if (av && p.avatar_url) {
    var img = document.createElement('img');
    img.src = p.avatar_url; img.alt = 'Avatar';
    av.insertBefore(img, av.firstChild);
    if (letter) letter.style.display = 'none';
  }
  var nm = g('pf-name'); if (nm) nm.textContent = p.username || '—';
  var cg = g('pf-chip-global'); if (cg) cg.textContent = PROF_GRADES[p.role_global] || p.role_global || '—';
  var cw = g('pf-chip-wow');    if (cw) cw.textContent = '⚔️ ' + (PROF_GRADES[p.role_wow] || p.role_wow || '—');
  var cs = g('pf-chip-swtor');  if (cs) cs.textContent = '🚀 ' + (PROF_GRADES[p.role_swtor] || p.role_swtor || '—');
  var em = g('pf-email'); if (em) em.textContent = email || '—';
  if (g('pf-username')) g('pf-username').value = p.username || '';
  if (g('pf-discord'))  g('pf-discord').value  = p.discord_pseudo || '';

  // WoW : masquer si invité, sinon remplir
  if (!p.role_wow || p.role_wow === 'invite') {
    var wowTab = document.querySelector('.game-tab.wow');
    if (wowTab) wowTab.style.display = 'none';
    var wowPanel = g('gpanel-wow');
    if (wowPanel) wowPanel.style.display = 'none';
  } else {
    if (g('pf-wow-pseudo'))  g('pf-wow-pseudo').value  = p.wow_pseudo || '';
    if (g('pf-wow-role'))    g('pf-wow-role').value    = p.wow_role || '';
    if (g('pf-wow-spec'))    g('pf-wow-spec').value    = p.wow_spec || '';
    if (g('pf-wow-faction')) g('pf-wow-faction').value = p.wow_faction || '';
    if (g('pf-wow-class'))   g('pf-wow-class').value   = p.wow_class || '';
    if (g('pf-raiderio'))    g('pf-raiderio').value    = p.raiderio_url || '';
  }

  // SWTOR : masquer si invité, sinon remplir
  if (!p.role_swtor || p.role_swtor === 'invite') {
    var swtorTab = document.querySelector('.game-tab.swtor');
    if (swtorTab) swtorTab.style.display = 'none';
    var swtorPanel = g('gpanel-swtor');
    if (swtorPanel) swtorPanel.style.display = 'none';
  } else {
    if (g('pf-swtor-pseudo'))  g('pf-swtor-pseudo').value  = p.swtor_pseudo || '';
    if (g('pf-swtor-role'))    g('pf-swtor-role').value    = p.swtor_role || '';
    if (g('pf-swtor-spec'))    g('pf-swtor-spec').value    = p.swtor_spec || '';
    if (g('pf-swtor-faction')) g('pf-swtor-faction').value = p.swtor_faction || '';
    if (g('pf-swtor-class'))   g('pf-swtor-class').value   = p.swtor_class || '';
  }
  // Activer le premier onglet visible
  document.querySelectorAll('.game-tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.game-panel').forEach(function(t) { t.classList.remove('active'); });
  var firstTab = document.querySelector('.game-tab:not([style*="display: none"]):not([style*="display:none"])');
  if (firstTab) {
    firstTab.classList.add('active');
    var game = firstTab.classList.contains('wow') ? 'wow' : 'swtor';
    var panel = g('gpanel-' + game);
    if (panel) panel.classList.add('active');
  }
}

async function saveProfile() {
  if (!_uid) return;
  var ok = await sbPatch('/rest/v1/profiles?id=eq.' + _uid, {
    username: v('pf-username'), discord_pseudo: v('pf-discord') || null
  });
  if (ok) { showMsg('save-msg'); var nm=g('pf-name'); if(nm) nm.textContent=v('pf-username'); var l=g('pf-avatar-letter'); if(l) l.textContent=(v('pf-username')||'?')[0].toUpperCase(); }
}

async function saveWow() {
  if (!_uid) return;
  var ok = await sbPatch('/rest/v1/profiles?id=eq.' + _uid, {
    wow_pseudo: v('pf-wow-pseudo')||null, wow_faction: v('pf-wow-faction')||null,
    wow_class: v('pf-wow-class')||null, wow_role: v('pf-wow-role')||null, wow_spec: v('pf-wow-spec')||null, raiderio_url: v('pf-raiderio')||null
  });
  if (ok) showMsg('save-wow-msg');
}

async function saveSwtor() {
  if (!_uid) return;
  var ok = await sbPatch('/rest/v1/profiles?id=eq.' + _uid, {
    swtor_pseudo: v('pf-swtor-pseudo')||null, swtor_faction: v('pf-swtor-faction')||null,
    swtor_class: v('pf-swtor-class')||null, swtor_role: v('pf-swtor-role')||null, swtor_spec: v('pf-swtor-spec')||null
  });
  if (ok) showMsg('save-swtor-msg');
}

async function uploadAvatar(input) {
  if (!input.files || !input.files[0] || !_uid) return;
  var file = input.files[0];
  if (file.size > 512000) { alert('Image trop lourde — 500 KB maximum.'); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var MAX = 300;
      var ratio = Math.min(MAX/img.width, MAX/img.height);
      canvas.width = Math.round(img.width*ratio); canvas.height = Math.round(img.height*ratio);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(function(blob) { doUpload(blob); }, 'image/jpeg', 0.85);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function doUpload(blob) {
  var prog = g('avatar-progress'); if (prog) prog.style.width = '30%';
  var path = _uid + '/avatar.jpg';
  var t = tok();
  try {
    await fetch(PROF_SB + '/storage/v1/object/avatars/' + path, { method:'DELETE', headers:{'apikey':PROF_KEY,'Authorization':'Bearer '+t} });
    if (prog) prog.style.width = '60%';
    var r = await fetch(PROF_SB + '/storage/v1/object/avatars/' + path, {
      method:'POST', headers:{'apikey':PROF_KEY,'Authorization':'Bearer '+t,'Content-Type':'image/jpeg'}, body: blob
    });
    if (r.ok || r.status === 200) {
      var url = PROF_SB + '/storage/v1/object/public/avatars/' + path + '?t=' + Date.now();
      await sbPatch('/rest/v1/profiles?id=eq.' + _uid, { avatar_url: url });
      var av = g('pf-avatar');
      if (av) {
        var existing = av.querySelector('img');
        if (!existing) { var img = document.createElement('img'); img.src=url; img.alt='Avatar'; av.insertBefore(img, av.firstChild); var l=g('pf-avatar-letter'); if(l) l.style.display='none'; }
        else existing.src = url;
      }
      if (prog) { prog.style.width='100%'; setTimeout(function(){ prog.style.width='0%'; }, 500); }
      showMsg('save-msg');
    }
  } catch(e) { alert('Erreur upload : ' + e.message); if(prog) prog.style.width='0%'; }
}

async function loadCandidatures(email) {
  if (!email) return;
  var el = g('pf-cand-list'); if (!el) return;
  try {
    var r = await fetch(PROF_SB + '/rest/v1/applications?email=eq.' + encodeURIComponent(email) + '&order=created_at.desc&select=id,game,character_name,status,created_at', {
      headers: { 'apikey': PROF_KEY, 'Authorization': 'Bearer ' + PROF_KEY }
    });
    var data = await r.json();
    if (!Array.isArray(data) || !data.length) {
      el.innerHTML = '<div class="cand-empty">Aucune candidature trouvée.</div>';
      g('pf-candidatures').style.display = 'block';
      return;
    }
    var STATUS_MAP = { en_attente:'pending', accepte:'accepted', refuse:'refused', pending:'pending', accepted:'accepted', refused:'refused' };
    var STATUS_LBL = { pending:'En attente', accepted:'Accepté ✓', refused:'Refusé' };
    var GAME_COLOR = { wow:'#3B82F6', swtor:'#FF3A3A', guild:'#F0C040' };
    var GAME_LBL   = { wow:'WoW', swtor:'SWTOR', guild:'Guilde' };
    el.innerHTML = data.map(function(c) {
      var sc = STATUS_MAP[c.status] || 'pending';
      var date = c.created_at ? new Date(c.created_at).toLocaleDateString('fr-FR', { day:'2-digit', month:'long', year:'numeric' }) : '—';
      return '<div class="cand-item">' +
        '<div class="cand-game-dot" style="background:' + (GAME_COLOR[c.game] || '#888') + ';"></div>' +
        '<div class="cand-info"><div class="cand-name">' + (c.character_name || 'Candidature') + '</div><div class="cand-date">' + date + '</div></div>' +
        '<div class="cand-game-lbl">' + (GAME_LBL[c.game] || c.game || '—') + '</div>' +
        '<div class="cand-status ' + sc + '">' + (STATUS_LBL[sc] || sc) + '</div>' +
        '</div>';
    }).join('');
    g('pf-candidatures').style.display = 'block';
  } catch(e) {}
}

function onAuthReady(user, profile) {
  g('profil-loading').style.display = 'none';
  if (!user) { g('profil-nologin').style.display = 'block'; return; }
  _uid = user.id;
  g('profil-content').style.display = 'block';
  var email = '';
  try {
    var sess = JSON.parse(localStorage.getItem('abs_sess'));
    var pay  = JSON.parse(atob(sess.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    email = pay.email || '';
  } catch(e) {}
  fillProfile(profile, email);
  loadCandidatures(email);
}
</script>
